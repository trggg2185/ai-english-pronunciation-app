name: eng_pron_app
description: "AI English Pronunciation & Discipline App - Group 6"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.6
  record: 7.1.2

  # Local Database & Storage
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Local Notifications & Timezone
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Utility
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.3 # For desktop / unit testing SQLite without mobile device

flutter:
  uses-material-design: true
  assets:
    - assets/speech_ai/cmudict.dict
    - assets/speech_ai/CMUDICT_LICENSE

  # assets:
  #   - assets/images/
  #   - assets/audio/
